spring.datasource.url=jdbc:h2:mem:clemen_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/inventario
app.flyway.bootstrap.enabled=false

DB_USERNAME=sa
DB_PASS=
DB_SECURNAME=test-user
DB_SECURPASS=test-pass
DB_JWTSECRET=0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF
MAIL_HOST=localhost
MAIL_PORT=1025
MAIL_USERNAME=test@example.com
MAIL_PASSWORD=dummy
MAIL_FROM=no-reply@test.local

app.cors.allowed-origins=http://localhost:5173
