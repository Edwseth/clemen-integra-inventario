server:
  port: 8081
  servlet:
    context-path: /pruebas

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clemen_pruebas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://erp.clemenlab.com}
