# === PERFIL PRUEBAS ===
server.port=8081
server.servlet.context-path=/pruebas
  
  # DB PRUEBAS (aislada)
spring.datasource.url=${DB_URL_PRUEBAS:jdbc:mysql://localhost:3306/clemen_pruebas?useSSL=false&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME_PRUEBAS:${DB_USERNAME}}
spring.datasource.password=${DB_PASS_PRUEBAS:${DB_PASS}}
  
  # Producción-like (no siembra, no ddl)
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
  
  # CORS (misma UI, mismo origen)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://erp.clemenlab.com}
