spring.application.name=clemen-integra-erp

# --- Puerto de la app en el servidor ---
# Puedes cambiar SERVER_PORT en el servidor, por defecto 8080
server.port=8081

# --- Datasource MySQL (PRODUCCIÓN) ---
# URL de BD, por defecto apunta a localhost y a la base clemen_integra_erp
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clemen_integra_erp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota}

# Usuario y contraseña se leen de variables de entorno (las mismas que ya usas en dev)
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate (sin tocar estructura en PROD) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# No ejecutar scripts automáticos en PROD
spring.sql.init.mode=never

# Desactivar cualquier bootstrap Flyway automático en PROD
spring.flyway.enabled=false
app.flyway.bootstrap.enabled=false

# --- Logs en archivo (ruta típica Linux, configurable por variable) ---
logging.level.root=INFO
logging.file.name=${LOG_PATH:/var/log/clemen-integra/clemen-integra-erp.log}
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=10MB

# --- CORS para PROD (dominio real de Clemen) ---
# Si no se define CORS_ALLOWED_ORIGINS, quedará vacío y usará lo que tengas en config global
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://erp.clemenlab.com}

