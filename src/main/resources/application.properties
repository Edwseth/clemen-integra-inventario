# Desactivar auto-Flyway (evita ejecuciones posteriores)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none

# Bootstrap Flyway "solo primera vez"
app.flyway.bootstrap.enabled=true
app.flyway.migrations.locations=classpath:db/migration
app.flyway.baseline-on-migrate=true
app.flyway.baseline-version=1

# Segunda BD (DEMO) a sincronizar en el mismo arranque
app.flyway.secondary.url=jdbc:mysql://localhost:3306/clemen_integra_erp_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
app.flyway.secondary.user=ci_demo
app.flyway.secondary.password=DespliegueClemenIntegraErpDemo

spring.datasource.url=jdbc:mysql://localhost:3306/clemen_integra_erp
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO

server.port=8081
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
#springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.security.user.name=${DB_SECURNAME}
spring.security.user.password=${DB_SECURPASS}

spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.willyes.clemenintegra

# Clave secreta para firma JWT
clemen.jwt.secret=${DB_JWTSECRET}

spring.flyway.locations=classpath:db/migration

logging.level.org.springframework.security=DEBUG
logging.level.com.willyes.clemenintegra.shared.security=DEBUG
#logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

app.inventario.prebodega.id=6

# ===========================
#  Correo saliente (Hostinger)
# ===========================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.default-encoding=UTF-8

# Remitente por defecto para notificaciones de la app
app.mail.from=${MAIL_FROM}

# --- ALMACENES (generales) ---
inventory.almacen.pt.id=2
inventory.almacen.cuarentena.id=7
inventory.almacen.obsoletos.id=3

# --- PRODUCCI\u00D3N / ORIGENES ---
inventory.produccion.almacen.origen.materiaPrima=1
inventory.produccion.almacen.origen.materialEmpaque=5
inventory.produccion.almacen.origen.suministros=4
inventory.produccion.almacen.origen.preBodegaProduccion=6
inventory.produccion.almacen.origen.productoSemiElaborado=8

# --- MOTIVOS (por clave de clasificacion) ---
inventory.motivo.entradaPt=ENTRADA_PRODUCTO_TERMINADO
inventory.motivo.transferenciaCalidad=TRANSFERENCIA_GENERAL
inventory.motivo.devolucionDesdeProduccion=DEVOLUCION_DESDE_PRODUCCION
inventory.motivo.salidaProduccion=SALIDA_PRODUCCION

# --- TIPOS DE DETALLE ---
inventory.tipoDetalle.entradaId=6
inventory.tipoDetalle.transferenciaId=12
inventory.tipoDetalle.salidaId=11
inventory.tipoDetalle.salidaPtId=11
inventory.salidaPt.enabled=true

# --- CLASIFICACIONES DE MOVIMIENTO / IDs ESPECIALES ---
inventory.mov.clasificacion.entradaPt=ENTRADA_PRODUCTO_TERMINADO
inventory.mov.clasificacion.liberacionCalidad=LIBERACION_CALIDAD
inventory.mov.clasificacion.rechazoCalidad=RECHAZO_CALIDAD
inventory.mov.motivo.ajusteRechazo=15

# --- JOB LOTES VENCIDOS ---
inventory.vencidos.job.enabled=true
inventory.vencidos.job.cron=0 0 0 * * *
inventory.vencidos.job.timezone=America/Bogota
inventory.vencidos.estadoObjetivo=VENCIDO
inventory.vencidos.chunkSize=500
inventory.vencidos.movimiento.enabled=true
inventory.vencidos.movimiento.motivoId=${inventory.mov.motivo.ajusteRechazo}
inventory.vencidos.movimiento.clasificacion=RECHAZO_CALIDAD
inventory.vencidos.almacenDestinoId=${inventory.almacen.obsoletos.id}

# --- LOTE ---
inventory.lote.estadoLiberado=DISPONIBLE

# --- SOLICITUDES ---
inventory.solicitud.estados.pendientes=PENDIENTE,AUTORIZADA,RESERVADA
inventory.solicitud.estados.concluyentes=ATENDIDA,EJECUTADA,CANCELADA,RECHAZADO

inventory.um.decimales.min=0
inventory.um.decimales.max=6
inventory.um.redondeo=HALF_UP
