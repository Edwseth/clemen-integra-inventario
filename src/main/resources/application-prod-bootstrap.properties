# Hereda configuración de prod (puertos, datasource, CORS, logging, etc.)
spring.profiles.include=prod

# Habilita migraciones Flyway solo para la fase de instalación/actualización
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/inventario
