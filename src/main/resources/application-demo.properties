# Puerto y binding en IPv4 (evita el ::1)
server.port=8080
server.address=127.0.0.1
server.forward-headers-strategy=framework
# Or\u00EDgenes para demo (Vercel + Tunnel)
app.cors.allowed-origins=https://clemen-integra-demo-front.vercel.app,https://*.trycloudflare.com

# (opcional) Exponer health por si lo necesitas
management.endpoints.web.exposure.include=health,info

# 1) Activa Flyway en este perfil
spring.flyway.enabled=false

# 2) Permite que Hibernate cree/actualice el esquema
#    - "create" borra y crea el esquema en cada arranque (ideal para una BD vac\u00EDa la 1\u00AA vez)
#    - "update" crea lo que falte sin borrar lo existente
#    - "validate" solo valida que el esquema est\u00E9 acorde con las entidades JPA
spring.jpa.hibernate.ddl-auto=none

app.flyway.bootstrap.enabled=true
app.flyway.migrations.locations=classpath:db/migration
app.flyway.baseline-on-migrate=true
app.flyway.baseline-version=1



# --- JOB LOTES VENCIDOS (DEMO) ---
inventory.vencidos.job.enabled=true
inventory.vencidos.job.cron=0 0 0 * * *
inventory.vencidos.job.timezone=America/Bogota
inventory.vencidos.estadoObjetivo=VENCIDO
inventory.vencidos.chunkSize=500
inventory.vencidos.movimiento.enabled=true
inventory.vencidos.movimiento.motivoId=15
inventory.vencidos.movimiento.clasificacion=RECHAZO_CALIDAD
inventory.vencidos.almacenDestinoId=3
# Aquí la secundaria es la PRINCIPAL
app.flyway.secondary.url=jdbc:mysql://localhost:3306/clemen_integra_erp
app.flyway.secondary.user=${DB_USERNAME}
app.flyway.secondary.password=${DB_PASS}

# 3) (Opcional pero MUY \u00FAtil) Sembrar datos base desde data.sql
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# 4) Tu datasource (ejemplo)
spring.datasource.url=jdbc:mysql://localhost:3306/clemen_integra_erp_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=ci_demo
spring.datasource.password=DespliegueClemenIntegraErpDemo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO

security.session.max-idle-minutes=20
